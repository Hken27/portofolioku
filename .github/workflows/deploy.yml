name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Firebase Config
        env:
          API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          test -n "$API_KEY" || (echo "FIREBASE_API_KEY belum diatur" && exit 1)
          test -n "$AUTH_DOMAIN" || (echo "FIREBASE_AUTH_DOMAIN belum diatur" && exit 1)
          test -n "$PROJECT_ID" || (echo "FIREBASE_PROJECT_ID belum diatur" && exit 1)
          test -n "$STORAGE_BUCKET" || (echo "FIREBASE_STORAGE_BUCKET belum diatur" && exit 1)
          test -n "$SENDER_ID" || (echo "FIREBASE_MESSAGING_SENDER_ID belum diatur" && exit 1)
          test -n "$APP_ID" || (echo "FIREBASE_APP_ID belum diatur" && exit 1)

          cat > firebase-config.js <<EOF
          export const firebaseConfig = {
            apiKey: "$API_KEY",
            authDomain: "$AUTH_DOMAIN",
            projectId: "$PROJECT_ID",
            storageBucket: "$STORAGE_BUCKET",
            messagingSenderId: "$SENDER_ID",
            appId: "$APP_ID"
          };
          EOF

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
